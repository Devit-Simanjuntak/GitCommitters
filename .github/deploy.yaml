name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ] # Workflow berjalan saat ada push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout kode dari repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Login ke Docker Hub menggunakan Secret yang sudah dibuat
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build & Push Image SERVER
    - name: Build and push Server image
      uses: docker/build-push-action@v4
      with:
        context: ./server  # Lokasi Dockerfile Server
        push: true
        tags: devitsimanjuntak/perpustakaan-server:latest

    # 4. Build & Push Image CLIENT
    - name: Build and push Client image
      uses: docker/build-push-action@v4
      with:
        context: ./client  # Lokasi Dockerfile Client
        push: true
        tags: devitsimanjuntak/perpustakaan-client:latest
